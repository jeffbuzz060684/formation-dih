</script>
<script>
// Formation DIH — application vanilla (PWA) — v3 (ergonomie pédagogique)
// Réutilise D, SVGS, SIGNES du cœur (web-v3-core.js, contenu verrouillé)
(function () {
  "use strict";
  var LS_CHECKS = "dih-checks-v1";
  var LS_QUIZ = "dih-quiz-v1";
  var LS_UI = "dih-ui-v1";
  var FB_VERSION = "v7";

  function loadLS(key, fb) {
    try {
      if (typeof localStorage === "undefined" || localStorage === null) return fb;
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fb;
    } catch (e) { return fb; }
  }
  function saveLS(key, obj) {
    try {
      if (typeof localStorage === "undefined" || localStorage === null) return;
      localStorage.setItem(key, JSON.stringify(obj));
    } catch (e) {}
  }

  var APP = {
    tab: "accueil",
    pump: "mark3",
    checks: loadLS(LS_CHECKS, {}),
    quiz: loadLS(LS_QUIZ, {}),
    ui: loadLS(LS_UI, null) || { open: {}, last: null },
    version: ""
  };
  if (!APP.ui || typeof APP.ui !== "object") APP.ui = { open: {}, last: null };
  if (!APP.ui.open || typeof APP.ui.open !== "object") APP.ui.open = {};
  if (typeof APP.ui.last !== "string") APP.ui.last = null;

  function saveUI() { saveLS(LS_UI, APP.ui); }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  var ACC = {
    sky:    ["rgba(56,189,248,0.12)", "rgba(56,189,248,0.4)"],
    amber:  ["rgba(251,191,36,0.12)", "rgba(251,191,36,0.4)"],
    red:    ["rgba(248,113,113,0.12)", "rgba(248,113,113,0.4)"],
    violet: ["rgba(167,139,250,0.12)", "rgba(167,139,250,0.4)"],
    orange:  ["rgba(249,115,22,0.12)", "rgba(249,115,22,0.4)"],
    emerald: ["rgba(52,211,153,0.12)", "rgba(52,211,153,0.4)"]
  };

  // ------------------------------------------------------------------
  // ÉTAT DES ACCORDÉONS (persisté dans dih-ui-v1)
  // ------------------------------------------------------------------
  function openList(tk) {
    var o = APP.ui.open[tk];
    return Array.isArray(o) ? o : [0];
  }
  function ensureOpen(tk, idx) {
    var o = openList(tk).slice();
    if (o.indexOf(idx) === -1) { o.push(idx); APP.ui.open[tk] = o; saveUI(); }
  }
  function toggleAcc(tk, idx) {
    var o = openList(tk).slice();
    var p = o.indexOf(idx);
    if (p === -1) o.push(idx); else o.splice(p, 1);
    APP.ui.open[tk] = o; saveUI(); render();
  }
  function setAllAcc(tk, open, count) {
    var o = [];
    if (open) { for (var i = 0; i < count; i++) o.push(i); }
    APP.ui.open[tk] = o; saveUI(); render();
  }

  function accCard(tk, idx, head, body) {
    var open = openList(tk).indexOf(idx) !== -1;
    return '<div class="card"><button type="button" class="acchead' + (open ? " open" : "") + '" data-acc="' + tk + "|" + idx + '">' + head + '<span class="chev">▾</span></button><div class="accbody' + (open ? " open" : "") + '">' + body + '</div></div>';
  }
  function accHead(icon, title, meta) {
    return '<span class="st"><span>' + icon + '</span> ' + esc(title) + '</span>' + (meta || "");
  }
  function renderToolbar(tk, count) {
    return '<div class="toolbar"><button type="button" class="tbtn" data-allop="' + tk + '|open">▽ Tout ouvrir</button><button type="button" class="tbtn" data-allop="' + tk + '|close">△ Tout replier</button></div>';
  }

  // ------------------------------------------------------------------
  // BLOCS DE CONTENU (identiques v2 — contenu verrouillé)
  // ------------------------------------------------------------------
  function renderBlock(b) {
    var h = "";
    if (b.h) h += '<h4 class="bh">' + esc(b.h) + '</h4>';
    if (b.ul) {
      h += '<ul class="bl">';
      for (var i = 0; i < b.ul.length; i++) h += '<li><span class="li-txt">' + b.ul[i] + '</span></li>';
      h += '</ul>';
    }
    if (b.table) {
      h += '<div class="twrap"><table><thead><tr>';
      for (var c = 0; c < b.table.head.length; c++) h += '<th>' + esc(b.table.head[c]) + '</th>';
      h += '</tr></thead><tbody>';
      for (var r = 0; r < b.table.rows.length; r++) {
        h += '<tr' + (r % 2 ? ' class="odd"' : '') + '>';
        for (var c2 = 0; c2 < b.table.rows[r].length; c2++) h += '<td>' + esc(b.table.rows[r][c2]) + '</td>';
        h += '</tr>';
      }
      h += '</tbody></table></div>';
    }
    if (b.chips) {
      h += '<div class="chips">';
      for (var k = 0; k < b.chips.length; k++) h += '<span class="chip">' + esc(b.chips[k]) + '</span>';
      h += '</div>';
    }
    if (b.note) {
      h += '<div class="note ' + (b.kind === "key" ? "key" : "warn") + '">' + (b.kind === "key" ? "🔑 " : "⚠ ") + b.note + '</div>';
    }
    if (b.signes) {
      h += '<div class="chips">';
      for (var s = 0; s < b.signes.length; s++) {
        var code = b.signes[s];
        h += '<span class="chip"><b class="signe-code">' + esc(code) + '</b> — ' + esc(SIGNES[code]) + '</span>';
      }
      h += '</div>';
    }
    return h;
  }

  function renderSection(sec) {
    var h = "";
    if (sec.intro) h += '<p class="intro">' + sec.intro + '</p>';
    if (sec.svg && SVGS[sec.svg]) h += '<div class="drawing" title="Toucher pour agrandir">' + SVGS[sec.svg]() + '</div><div class="zhint">👆 Touche le dessin pour l\'agrandir</div>';
    if (sec.blocks) {
      for (var i = 0; i < sec.blocks.length; i++) {
        var b = sec.blocks[i];
        if (b.svg && SVGS[b.svg]) h += '<div class="drawing" title="Toucher pour agrandir">' + SVGS[b.svg]() + '</div><div class="zhint">👆 Touche le dessin pour l\'agrandir</div>';
        h += renderBlock(b);
      }
    }
    return h;
  }

  function checkKey(docId, phaseIdx) { return docId + "-" + phaseIdx; }

  function countDone(k, len) {
    var arr = APP.checks[k] || [];
    var c = 0;
    for (var i = 0; i < len; i++) if (arr[i]) c++;
    return c;
  }

  function toggleCheck(docId, phaseIdx, i) {
    var k = checkKey(docId, phaseIdx);
    var arr = APP.checks[k] || [];
    arr[i] = !arr[i];
    APP.checks[k] = arr;
    saveLS(LS_CHECKS, APP.checks);
    ensureCheckOpen(docId, phaseIdx);
    render();
  }

  function resetChecks(docId, phaseIdx) {
    delete APP.checks[checkKey(docId, phaseIdx)];
    saveLS(LS_CHECKS, APP.checks);
    ensureCheckOpen(docId, phaseIdx);
    render();
  }

  function ensureCheckOpen(docId, phaseIdx) {
    if (docId.indexOf("mp-") === 0) {
      var pid = docId.slice(3);
      var p = null;
      for (var j = 0; j < D.motopompes.length; j++) if (D.motopompes[j].id === pid) p = D.motopompes[j];
      if (p) {
        // ordre des accordéons pompe : 0 carburant, 1 caractéristiques, 2 démarrage, 3 arrêt…
        ensureOpen(docId, phaseIdx === 1 && p.stop ? 3 : 2);
      }
      return;
    }
    ensureOpen(docId, phaseIdx);
  }

  function renderSteps(docId, phaseIdx, steps) {
    var k = checkKey(docId, phaseIdx);
    var arr = APP.checks[k] || [];
    var count = 0;
    for (var i = 0; i < steps.length; i++) if (arr[i]) count++;
    var pct = steps.length ? Math.round((count / steps.length) * 100) : 0;
    var h = '<div class="pbarrow"><div class="pbar"><div class="pbar-fill" style="width:' + pct + '%;"></div></div>';
    h += '<span class="pcount">' + count + '/' + steps.length + '</span>';
    h += '<button type="button" class="reset" data-reset="' + docId + '|' + phaseIdx + '">↺ Reset</button></div>';
    h += '<ol class="steps">';
    for (i = 0; i < steps.length; i++) {
      var s = steps[i];
      var done = !!arr[i];
      h += '<li><button type="button" class="step' + (done ? ' done' : '') + '" data-check="' + docId + '|' + phaseIdx + '|' + i + '">';
      h += '<span class="snum">' + (done ? '✓' : (i + 1)) + '</span>';
      h += '<span class="stxt">';
      h += '<span class="stitle' + (s.warn ? ' swarn' : '') + '">' + (s.warn ? '⚠ ' : '') + esc(s.t) + '</span>';
      if (s.d) h += '<span class="sd">' + s.d + '</span>';
      h += '</span></button></li>';
    }
    h += '</ol>';
    if (steps.length && count === steps.length) h += '<div class="phase-ok">✅ Phase terminée</div>';
    return h;
  }

  // ------------------------------------------------------------------
  // QUIZ (feedback immédiat + recommencer)
  // ------------------------------------------------------------------
  function pick(quizId, qi, oi) {
    if (!APP.quiz[quizId]) APP.quiz[quizId] = {};
    APP.quiz[quizId][qi] = oi;
    saveLS(LS_QUIZ, APP.quiz);
    ensureQuizOpen(quizId);
    render();
  }

  function resetQuiz(quizId) {
    delete APP.quiz[quizId];
    saveLS(LS_QUIZ, APP.quiz);
    ensureQuizOpen(quizId);
    render();
  }

  function quizScore(quizId, items) {
    var q = APP.quiz[quizId] || {};
    var n = 0;
    for (var i = 0; i < items.length; i++) if (q[i] === items[i].a) n++;
    return n;
  }

  function ensureQuizOpen(quizId) {
    for (var m = 0; m < D.modules.length; m++) {
      if (D.modules[m].id === quizId) { ensureOpen(quizId, D.modules[m].sections.length); return; }
    }
    var docs = [D.reflexe, D.grue];
    for (var d = 0; d < docs.length; d++) {
      if (docs[d].id === quizId) { ensureOpen(docs[d].id, docs[d].phases.length + (docs[d].obs ? 1 : 0)); return; }
    }
  }

  function renderQuiz(quizId, items) {
    var q = APP.quiz[quizId] || {};
    var answered = 0;
    for (var k2 = 0; k2 < items.length; k2++) if (q[k2] !== undefined) answered++;
    var h = '<div class="qreset-row"><button type="button" class="reset" data-resetquiz="' + quizId + '">↺ Recommencer</button></div>';
    for (var qi = 0; qi < items.length; qi++) {
      var it = items[qi];
      h += '<div class="qitem"><p class="qq">' + (qi + 1) + '. ' + esc(it.q) + '</p>';
      for (var oi = 0; oi < it.opts.length; oi++) {
        var cls = 'opt';
        if (q[qi] !== undefined) {
          if (oi === it.a) cls += ' correct';
          else if (oi === q[qi]) cls += ' wrong';
        }
        h += '<button type="button" class="' + cls + '" data-quiz="' + quizId + '|' + qi + '|' + oi + '">' + esc(it.opts[oi]) + '</button>';
      }
      if (q[qi] !== undefined) h += '<p class="qex">' + (q[qi] === it.a ? '✅ ' : '❌ ') + it.ex + '</p>';
      h += '</div>';
    }
    return h;
  }

  function renderHead(obj) {
    var a = ACC[obj.accent] || ACC.sky;
    var style = 'background:' + a[0] + ';border-color:' + a[1] + ';';
    return '<div class="headband" style="' + style + '"><span class="hb-emoji">' + obj.emoji + '</span><div><h2>' + esc(obj.name) + '</h2><p>' + esc(obj.subtitle) + '</p></div></div>';
  }

  // ------------------------------------------------------------------
  // MODULES (équipier / chef) — sections en accordéons
  // ------------------------------------------------------------------
  function renderModule(mod) {
    var tk = mod.id;
    var h = renderHead(mod);
    h += renderToolbar(tk, mod.sections.length + 1);
    for (var i = 0; i < mod.sections.length; i++) {
      var sec = mod.sections[i];
      h += accCard(tk, i, accHead(sec.icon, sec.title), renderSection(sec));
    }
    var qs = quizScore(mod.id, mod.quiz);
    h += accCard(tk, mod.sections.length, accHead("✏️", "Contrôle des connaissances", '<span class="qscore">' + qs + '/' + mod.quiz.length + '</span>'), renderQuiz(mod.id, mod.quiz));
    h += '<p class="src">Source : ' + esc(mod.source) + '</p>';
    return h;
  }

  // ------------------------------------------------------------------
  // FICHE RÉFLEXE / GRUE — vue d'ensemble + phases en accordéons
  // ------------------------------------------------------------------
  function renderOverview(doc) {
    var total = 0, done = 0;
    var tiles = "";
    for (var i = 0; i < doc.phases.length; i++) {
      var ph = doc.phases[i];
      var c = countDone(checkKey(doc.id, i), ph.steps.length);
      total += ph.steps.length; done += c;
      var p = ph.steps.length ? Math.round((c / ph.steps.length) * 100) : 0;
      tiles += '<button type="button" class="ptile' + (ph.steps.length && c === ph.steps.length ? ' full' : '') + '" data-acc="' + doc.id + '|' + i + '">';
      tiles += '<span class="pt-ico">' + ph.icon + '</span><b>' + esc(ph.title) + '</b>';
      tiles += '<span class="pt-count">' + c + '/' + ph.steps.length + '</span>';
      tiles += '<span class="pt-bar"><span style="width:' + p + '%;"></span></span></button>';
    }
    var h = '<div class="card overview"><div class="ov-head"><h3 class="st"><span>📊</span> Vue d\'ensemble</h3><span class="pcount">' + done + '/' + total + '</span></div><div class="pgrid">' + tiles + '</div></div>';
    return h;
  }

  function renderPhases(doc) {
    var tk = doc.id;
    var h = renderHead(doc);
    h += renderOverview(doc);
    h += renderToolbar(tk, doc.phases.length + 1 + (doc.obs ? 1 : 0));
    for (var i = 0; i < doc.phases.length; i++) {
      var ph = doc.phases[i];
      var inner = "";
      if (ph.intro) inner += '<p class="intro">' + ph.intro + '</p>';
      inner += renderSteps(doc.id, i, ph.steps);
      if (ph.warn) {
        inner += '<div class="note warn">⚠ ';
        for (var w = 0; w < ph.warn.length; w++) inner += (w > 0 ? '<br>⚠ ' : '') + ph.warn[w];
        inner += '</div>';
      }
      if (ph.note) inner += '<div class="note key">🔑 ' + ph.note + '</div>';
      h += accCard(tk, i, accHead(ph.icon, ph.title), inner);
    }
    var idx = doc.phases.length;
    if (doc.obs) {
      var obsInner = '<ul class="bl">';
      for (var o = 0; o < doc.obs.length; o++) obsInner += '<li><span class="li-txt">' + doc.obs[o] + '</span></li>';
      obsInner += '</ul>';
      h += accCard(tk, idx, accHead("📌", "Observations"), obsInner);
      idx++;
    }
    if (doc.quiz) {
      var qs = quizScore(doc.id, doc.quiz);
      h += accCard(tk, idx, accHead("✏️", "Contrôle des connaissances", '<span class="qscore">' + qs + '/' + doc.quiz.length + '</span>'), renderQuiz(doc.id, doc.quiz));
    }
    h += '<p class="src">Source : ' + esc(doc.source) + '</p>';
    return h;
  }

  // ------------------------------------------------------------------
  // MOTOPOPOMPES
  // ------------------------------------------------------------------
  function fmt(n) { return String(n).replace(/(\d)(?=(\d{3})+$)/g, "$1 "); }

  function setPump(id) { APP.pump = id; render(); }

  function renderMotopompes() {
    var h = '<nav class="subtabs">';
    for (var i = 0; i < D.motopompes.length; i++) {
      var p = D.motopompes[i];
      h += '<button type="button" class="subtab' + (APP.pump === p.id ? ' active' : '') + '" data-pump="' + p.id + '">' + p.emoji + " " + esc(p.name) + '</button>';
    }
    h += '<button type="button" class="subtab' + (APP.pump === "compare" ? ' active' : '') + '" data-pump="compare">⚖ Comparatif</button>';
    h += '</nav>';
    var pump = null;
    for (var j = 0; j < D.motopompes.length; j++) if (D.motopompes[j].id === APP.pump) pump = D.motopompes[j];
    if (APP.pump === "compare") h += renderCompare();
    else h += renderPump(pump || D.motopompes[0]);
    return h;
  }

  function renderPump(p) {
    var tk = "mp-" + p.id;
    var n = 0;
    var h = renderHead({ name: p.name, subtitle: p.subtitle, emoji: p.emoji, accent: p.accent });
    h += accCard(tk, n++, accHead("⛽", "Carburant"), '<div class="note key">🔑 ' + esc(p.fuelNote) + '</div>');
    h += '<div class="drawing" title="Toucher pour agrandir">' + SVGS[p.svg]() + '</div><div class="zhint">👆 Touche le dessin pour l\'agrandir</div>';
    var specsInner = '<div class="specs">';
    for (var i = 0; i < p.specs.length; i++) {
      specsInner += '<div class="spec"><span class="k">' + esc(p.specs[i][0]) + '</span><span class="v">' + esc(p.specs[i][1]) + '</span></div>';
    }
    specsInner += '</div>';
    h += accCard(tk, n++, accHead("📋", "Caractéristiques"), specsInner);
    h += accCard(tk, n++, accHead("▶️", "Démarrage — coche au fur et à mesure"), renderSteps("mp-" + p.id, 0, p.start));
    if (p.stop) h += accCard(tk, n++, accHead("⏹️", "Arrêt"), renderSteps("mp-" + p.id, 1, p.stop));
    if (p.controls) {
      var ctl = '<div class="mpgrid">';
      for (var c = 0; c < p.controls.length; c++) ctl += '<div class="mpitem"><span class="k">' + esc(p.controls[c][0]) + '</span><span class="v">' + esc(p.controls[c][1]) + '</span></div>';
      ctl += '</div>';
      h += accCard(tk, n++, accHead("🎮", "Commandes"), ctl);
    }
    if (p.del) {
      var del = '<div class="del">';
      for (var d = 0; d < p.del.length; d++) del += '<div class="dot dot-' + p.del[d][2] + '"><b>' + esc(p.del[d][0]) + '</b> — ' + esc(p.del[d][1]) + '</div>';
      del += '</div>';
      h += accCard(tk, n++, accHead("💡", "Voyants diagnostiques"), del);
    }
    if (p.extra) {
      var ex = '<ul class="bl">';
      for (var e = 0; e < p.extra.length; e++) ex += '<li><span class="li-txt">' + p.extra[e] + '</span></li>';
      ex += '</ul>';
      h += accCard(tk, n++, accHead("📌", "Points clés"), ex);
    }
    if (p.entretien) {
      var en = '<ul class="bl">';
      for (var t = 0; t < p.entretien.length; t++) en += '<li><span class="li-txt">' + p.entretien[t] + '</span></li>';
      en += '</ul>';
      h += accCard(tk, n++, accHead("🧽", "Entretien / remisage"), en);
    }
    h += '<p class="src">Source : ' + esc(p.source) + '</p>';
    return h;
  }

  function renderCompare() {
    var c = D.compareMP;
    var h = '<div class="card"><h3 class="st"><span>⚖</span> Débits max. (l/min)</h3>';
    for (var i = 0; i < c.debits.length; i++) {
      var d = c.debits[i];
      var w = Math.round((d[1] / 2000) * 100);
      h += '<div class="barrow"><span class="barlab">' + esc(d[0]) + '</span><div class="barbg"><div class="barfill" style="width:' + w + '%;background:' + d[2] + ';"></div></div><span class="barval">' + fmt(d[1]) + ' l/min</span></div>';
    }
    h += '</div>';
    h += '<div class="card"><h3 class="st"><span>🔑</span> Repères pression</h3><div class="note key">🔑 ' + esc(c.note) + '</div></div>';
    h += '<div class="card"><h3 class="st"><span>⛽</span> Règles carburant — à ne jamais confondre</h3><ul class="bl">';
    for (var r = 0; r < c.regles.length; r++) h += '<li><span class="li-txt">' + c.regles[r] + '</span></li>';
    h += '</ul></div>';
    return h;
  }

  // ------------------------------------------------------------------
  // ACCUEIL — tableau de bord de progression
  // ------------------------------------------------------------------
  function stepsTotal() {
    var n = 0;
    var docs = [D.reflexe, D.grue];
    for (var d = 0; d < docs.length; d++) {
      for (var i = 0; i < docs[d].phases.length; i++) n += docs[d].phases[i].steps.length;
    }
    for (var p = 0; p < D.motopompes.length; p++) {
      n += D.motopompes[p].start.length;
      if (D.motopompes[p].stop) n += D.motopompes[p].stop.length;
    }
    return n;
  }
  function stepsDone() {
    var n = 0;
    for (var k in APP.checks) {
      var arr = APP.checks[k];
      if (!arr) continue;
      for (var i = 0; i < arr.length; i++) if (arr[i]) n++;
    }
    return Math.min(n, stepsTotal());
  }
  function quizzesTotal() {
    return D.modules[0].quiz.length + D.modules[1].quiz.length + D.reflexe.quiz.length + D.grue.quiz.length;
  }
  function quizzesDone() {
    return quizScore(D.modules[0].id, D.modules[0].quiz) + quizScore(D.modules[1].id, D.modules[1].quiz) + quizScore(D.reflexe.id, D.reflexe.quiz) + quizScore(D.grue.id, D.grue.quiz);
  }
  function donutSvg(pct) {
    var r = 54;
    var c = 2 * Math.PI * r;
    var off = c * (1 - pct / 100);
    return '<svg viewBox="0 0 120 120" class="donut" role="img" aria-label="Progression ' + pct + ' pour cent">'
      + '<circle cx="60" cy="60" r="' + r + '" class="donut-bg"></circle>'
      + '<circle cx="60" cy="60" r="' + r + '" class="donut-fg" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"></circle>'
      + '<text x="60" y="60" text-anchor="middle" dominant-baseline="middle" class="donut-num">' + pct + '%</text>'
      + '<text x="60" y="78" text-anchor="middle" class="donut-lab">PROGRESSION</text></svg>';
  }

  function renderAccueil() {
    var st = stepsTotal(), sd = stepsDone();
    var qt = quizzesTotal(), qd = quizzesDone();
    var pct = Math.round(((sd + qd) / (st + qt)) * 100);
    var h = '<div class="hero"><h2>🎓 ' + esc(D.accueil.titre) + '</h2><p>' + esc(D.accueil.sousTitre) + '</p></div>';
    h += '<div class="card"><div class="dash">' + donutSvg(pct);
    h += '<div class="dash-stats">';
    h += '<div class="dstat">✅ Checklists — <b>' + sd + '/' + st + '</b> étapes validées</div>';
    h += '<div class="dstat">✏️ Quiz — <b>' + qd + '/' + qt + '</b> bonnes réponses</div>';
    h += '<div class="dstat">🎯 Entraîne-toi section par section, puis valide-toi avec les quiz.</div>';
    h += '</div></div></div>';
    var qe = quizScore(D.modules[0].id, D.modules[0].quiz);
    var qc = quizScore(D.modules[1].id, D.modules[1].quiz);
    var rfDone = 0, rfTot = 0;
    for (var r1 = 0; r1 < D.reflexe.phases.length; r1++) rfTot += D.reflexe.phases[r1].steps.length;
    rfDone = stepsDoneDoc(D.reflexe);
    var grDone = stepsDoneDoc(D.grue), grTot = 0;
    for (var r2 = 0; r2 < D.grue.phases.length; r2++) grTot += D.grue.phases[r2].steps.length;
    h += '<div class="quickgrid">';
    h += quickTile(D.modules[0].emoji, D.modules[0].name, "Quiz " + qe + "/" + D.modules[0].quiz.length, D.modules[0].id);
    h += quickTile(D.modules[1].emoji, D.modules[1].name, "Quiz " + qc + "/" + D.modules[1].quiz.length, D.modules[1].id);
    h += quickTile(D.reflexe.emoji, "Fiche réflexe", rfDone + "/" + rfTot + " étapes", D.reflexe.id);
    h += quickTile(D.grue.emoji, "Grue CM", grDone + "/" + grTot + " étapes", D.grue.id);
    h += quickTile("🚒", "Motopompes", "4 pompes + comparatif", "motopompes");
    h += '</div>';
    h += '<div class="card" style="margin-top:0.85rem;"><h3 class="st"><span>🎯</span> Objectifs de la formation</h3><ul class="bl">';
    for (var i = 0; i < D.accueil.objectifs.length; i++) h += '<li><span class="li-txt">' + D.accueil.objectifs[i] + '</span></li>';
    h += '</ul></div>';
    h += '<div class="card"><h3 class="st"><span>🗺️</span> Le parcours</h3>';
    for (i = 0; i < D.accueil.parcours.length; i++) {
      var p = D.accueil.parcours[i];
      h += '<div class="parc"><span class="parc-emoji">' + p[0] + '</span><div><b>' + esc(p[1]) + '</b><p>' + esc(p[2]) + '</p></div></div>';
    }
    h += '</div>';
    h += '<div class="card"><h3 class="st"><span>🚒</span> Motopompes intégrées</h3>';
    h += '<p class="intro">Les notices de démarrage des 4 motopompes (MARK 3, TOHATSU VE 1500, EFP-500-FL, FYR PAK) sont intégrées — onglet <button type="button" class="link-btn" data-tab="motopompes">🚒 Motopompes</button>.</p></div>';
    h += '<div class="card"><h3 class="st"><span>⚖</span> Avertissement</h3>';
    h += '<p class="intro">Application pédagogique de soutien à la formation, d\'après les documents BMPM/SOS HELI. Elle ne remplace ni la formation terrain, ni les fiches officielles, ni les ordres des formateurs et des chefs.</p></div>';
    return h;
  }

  function stepsDoneDoc(doc) {
    var n = 0;
    for (var i = 0; i < doc.phases.length; i++) n += countDone(checkKey(doc.id, i), doc.phases[i].steps.length);
    return n;
  }
  function quickTile(ico, title, sub, tabId) {
    return '<button type="button" class="quick" data-tab="' + tabId + '"><span class="quick-ico">' + ico + '</span><span class="quick-txt"><b>' + esc(title) + '</b><small>' + esc(sub) + '</small></span><span class="chev">›</span></button>';
  }

  // ------------------------------------------------------------------
  // NAVIGATION — barre d'onglets fixe en bas (pouce)
  // ------------------------------------------------------------------
  function tabsDef() {
    return [
      { id: "accueil", ico: "🎓", lab: "Accueil" },
      { id: D.modules[0].id, ico: D.modules[0].emoji, lab: "Équipier" },
      { id: D.modules[1].id, ico: D.modules[1].emoji, lab: "Chef" },
      { id: D.reflexe.id, ico: D.reflexe.emoji, lab: "Réflexe" },
      { id: D.grue.id, ico: D.grue.emoji, lab: "Grue" },
      { id: "motopompes", ico: "🚒", lab: "Motopompes" }
    ];
  }

  function setTab(id) {
    APP.tab = id;
    APP.ui.last = id;
    saveUI();
    render();
  }

  function render() {
    var root = (typeof document !== "undefined" && document) ? document.getElementById("app") : null;
    if (!root) return;
    var tabs = tabsDef();
    var bar = '<nav class="tabbar">';
    for (var i = 0; i < tabs.length; i++) {
      bar += '<button type="button" class="tab' + (APP.tab === tabs[i].id ? ' active' : '') + '" data-tab="' + tabs[i].id + '"><span class="tab-ico">' + tabs[i].ico + '</span><span class="tab-lab">' + tabs[i].lab + '</span></button>';
    }
    bar += '</nav>';
    var body = "";
    if (APP.tab === "accueil") body = renderAccueil();
    else if (APP.tab === D.reflexe.id) body = renderPhases(D.reflexe);
    else if (APP.tab === D.grue.id) body = renderPhases(D.grue);
    else if (APP.tab === "motopompes") body = renderMotopompes();
    else {
      var mod = null;
      for (var m = 0; m < D.modules.length; m++) if (D.modules[m].id === APP.tab) mod = D.modules[m];
      if (mod) body = renderModule(mod);
    }
    var html = '<header class="topbar"><h1 class="title"><span class="thelo">🚁</span> Formation DIH</h1>';
    html += '<p class="subtitle">Détachement d\'Intervention Héliporté — BMPM / SOS HELI</p></header>';
    html += '<main class="page">' + body + '</main>';
    html += '<footer>Contenu extrait des documents de formation BMPM/SOS HELI — Équipier DIH (08/2020) · Chef d\'équipe DIH (08/2019) · Fiche réflexe N°1 (04/2020) · Fiche de tâche grue CM DIH · Notices motopompes (MARK 3, TOHATSU VE 1500, EFP-500-FL, FYR PAK)</footer>';
    html += bar;
    root.innerHTML = html;
    bindEvents(root);
    wireZoomDrawings();
  }

  // ===== ZOOM DESSSINS (v7) =====
  var ZOOM = { open: false, svg: "", scale: 1, tx: 0, ty: 0 };
  function zoomState() { return { open: ZOOM.open, scale: ZOOM.scale, tx: ZOOM.tx, ty: ZOOM.ty }; }
  function applyZoomTransform() {
    var inner = (typeof document !== "undefined" && document && document.getElementById) ? document.getElementById("zoominner") : null;
    if (inner && inner.style) inner.style.transform = "translate(" + ZOOM.tx + "px," + ZOOM.ty + "px) scale(" + ZOOM.scale + ")";
  }
  function renderZoom() {
    var host = (typeof document !== "undefined" && document && document.getElementById) ? document.getElementById("zoombox") : null;
    if (!ZOOM.open) { if (host && host.parentNode) host.parentNode.removeChild(host); return; }
    if (!host && document.createElement && document.body && document.body.appendChild) {
      host = document.createElement("div");
      host.id = "zoombox";
      document.body.appendChild(host);
    }
    if (!host) return;
    host.className = "zoombox";
    host.innerHTML = ""
      + '<div class="zoombar">'
      + '<span class="zoomlab">🔍 Pincer ou boutons ± pour agrandir</span>'
      + '<button type="button" class="zbtn" data-zb="minus">−</button>'
      + '<button type="button" class="zbtn" data-zb="reset">↺</button>'
      + '<button type="button" class="zbtn" data-zb="plus">＋</button>'
      + '<button type="button" class="zbtn zclose" data-zb="close">✕</button>'
      + '</div>'
      + '<div class="zoomstage" id="zoomstage"><div class="zoominner" id="zoominner">' + ZOOM.svg + '</div></div>';
    wireZoomBtns(host);
    setupPinch(host);
  }
  function wireZoomBtns(host) {
    if (!host.querySelectorAll) return;
    var btns = host.querySelectorAll("[data-zb]");
    for (var i = 0; i < btns.length; i++) (function (b) {
      if (b.addEventListener) b.addEventListener("click", function () { zoomAction(b.getAttribute("data-zb")); });
    })(btns[i]);
  }
  function setupPinch(host) {
    var stage = host.querySelector ? host.querySelector(".zoomstage") : null;
    if (!stage || !stage.addEventListener) return;
    var pts = {}, lastDist = 0, moved = false, downAt = 0;
    stage.addEventListener("pointerdown", function (e) {
      var fresh = true;
      for (var k in pts) fresh = false;
      pts[e.pointerId] = { x: e.clientX, y: e.clientY };
      lastDist = 0;
      if (fresh) { moved = false; downAt = Date.now(); }
    });
    stage.addEventListener("pointermove", function (e) {
      var p = pts[e.pointerId];
      if (!p) return;
      var dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      var others = 0;
      for (var k in pts) if (k != e.pointerId) others++;
      if (others >= 1) {
        var q = null;
        for (var k2 in pts) if (k2 != e.pointerId) q = pts[k2];
        var dist = Math.sqrt((p.x - q.x) * (p.x - q.x) + (p.y - q.y) * (p.y - q.y));
        if (lastDist && dist) {
          ZOOM.scale = Math.max(1, Math.min(6, ZOOM.scale * (dist / lastDist)));
          applyZoomTransform();
        }
        lastDist = dist;
        moved = true;
      } else {
        if (ZOOM.scale > 1) { ZOOM.tx += dx; ZOOM.ty += dy; applyZoomTransform(); }
        if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
      }
    });
    function lift(e) {
      delete pts[e.pointerId];
      lastDist = 0;
    }
    stage.addEventListener("pointerup", function (e) {
      var wasFresh = moved === false && (Date.now() - downAt) < 400;
      lift(e);
      var left = 0;
      for (var k in pts) left++;
      if (wasFresh && left === 0) zoomAction("close");
    });
    stage.addEventListener("pointercancel", lift);
  }
  function zoomAction(a) {
    if (a === "plus") ZOOM.scale = Math.min(6, ZOOM.scale + 0.25);
    else if (a === "minus") ZOOM.scale = Math.max(1, ZOOM.scale - 0.25);
    else if (a === "reset") { ZOOM.scale = 1; ZOOM.tx = 0; ZOOM.ty = 0; }
    else if (a === "close") { ZOOM.open = false; renderZoom(); return; }
    applyZoomTransform();
  }
  function openZoom(svgHtml) {
    ZOOM.open = true; ZOOM.svg = svgHtml || ""; ZOOM.scale = 1; ZOOM.tx = 0; ZOOM.ty = 0;
    renderZoom();
  }
  function closeZoom() { ZOOM.open = false; renderZoom(); }
  function wireZoomDrawings() {
    if (typeof document === "undefined" || !document.querySelectorAll) return;
    var drs = document.querySelectorAll(".drawing");
    for (var i = 0; i < drs.length; i++) (function (d) {
      if (d.addEventListener && !d.getAttribute("data-zoom-ok")) {
        try { d.setAttribute("data-zoom-ok", "1"); } catch (e) {}
        d.addEventListener("click", function () {
          var svgEl = d.querySelector ? d.querySelector("svg") : null;
          openZoom(svgEl && svgEl.outerHTML ? svgEl.outerHTML : d.innerHTML);
        });
      }
    })(drs[i]);
  }

  function bindEvents(root) {
    if (!root.querySelectorAll) return;
    bind(root, "[data-tab]", function (el) { return function () { setTab(el.getAttribute("data-tab")); }; });
    bind(root, "[data-check]", function (el) {
      var parts = el.getAttribute("data-check").split("|");
      return function () { toggleCheck(parts[0], parseInt(parts[1], 10), parseInt(parts[2], 10)); };
    });
    bind(root, "[data-reset]", function (el) {
      var parts = el.getAttribute("data-reset").split("|");
      return function () { resetChecks(parts[0], parseInt(parts[1], 10)); };
    });
    bind(root, "[data-resetquiz]", function (el) { return function () { resetQuiz(el.getAttribute("data-resetquiz")); }; });
    bind(root, "[data-quiz]", function (el) {
      var parts = el.getAttribute("data-quiz").split("|");
      return function () { pick(parts[0], parseInt(parts[1], 10), parseInt(parts[2], 10)); };
    });
    bind(root, "[data-pump]", function (el) { return function () { setPump(el.getAttribute("data-pump")); }; });
    bind(root, "[data-acc]", function (el) {
      var parts = el.getAttribute("data-acc").split("|");
      return function () { toggleAcc(parts[0], parseInt(parts[1], 10)); };
    });
    bind(root, "[data-allop]", function (el) {
      var parts = el.getAttribute("data-allop").split("|");
      var count = accordionCount(parts[0]);
      return function () { setAllAcc(parts[0], parts[1] === "open", count); };
    });
  }
  function bind(root, sel, makeFn) {
    var els = root.querySelectorAll(sel);
    for (var i = 0; i < els.length; i++) {
      (function (el) {
        if (el.addEventListener) el.addEventListener("click", makeFn(el));
      })(els[i]);
    }
  }
  function accordionCount(tk) {
    for (var m = 0; m < D.modules.length; m++) if (D.modules[m].id === tk) return D.modules[m].sections.length + 1;
    var docs = [D.reflexe, D.grue];
    for (var d = 0; d < docs.length; d++) {
      if (docs[d].id === tk) return docs[d].phases.length + (docs[d].obs ? 1 : 0) + (docs[d].quiz ? 1 : 0);
    }
    return 8;
  }

  function updateBadge() {
    var el = (typeof document !== "undefined" && document) ? document.getElementById("badge") : null;
    if (el) el.textContent = "💾 Hors ligne · " + (APP.version || FB_VERSION);
  }

  function fetchVersion() {
    if (typeof fetch !== "function") { APP.version = FB_VERSION; updateBadge(); return; }
    fetch("version.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
      APP.version = (j && j.version) || FB_VERSION;
      updateBadge();
    }).catch(function () { APP.version = APP.version || FB_VERSION; updateBadge(); });
  }

  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    if (APP.ui.last) {
      var valid = false;
      var tabs = tabsDef();
      for (var i = 0; i < tabs.length; i++) if (tabs[i].id === APP.ui.last) valid = true;
      if (valid) APP.tab = APP.ui.last;
    }
    render();
    fetchVersion();
    if (typeof navigator !== "undefined" && navigator && typeof navigator.serviceWorker === "object") {
      try { navigator.serviceWorker.register("sw.js"); } catch (e) {}
    }
  }

  if (typeof document !== "undefined" && document && document.addEventListener) {
    document.addEventListener("DOMContentLoaded", boot);
    if (typeof document.readyState === "string" && document.readyState === "complete") boot();
  }

  if (typeof window !== "undefined" && window) {
    window.__DIH_APP = { APP: APP, boot: boot, render: render, setTab: setTab, setPump: setPump, toggleCheck: toggleCheck, resetChecks: resetChecks, pick: pick, quizScore: quizScore, resetQuiz: resetQuiz, toggleAcc: toggleAcc, setAllAcc: setAllAcc, openZoom: openZoom, closeZoom: closeZoom, zoomAction: zoomAction, zoomState: zoomState };
  }
})();
</script>
</body>
</html>
